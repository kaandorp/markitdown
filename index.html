<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Markitdown</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem('markitdown:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <!-- Icon sprite: <svg class="i"><use href="#i-name"></use></svg> -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
      <symbol id="i-menu" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16" /></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" /><path d="M7 3v5h8M7 21v-7h10v7" /></g></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11M7 10l5 5 5-5M5 20h14" /></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" /></g></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" /></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></g></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 5v14M5 12h14" /></symbol>
      <symbol id="i-file" viewBox="0 0 20 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 2h9l6 6v14H3z" /><path d="M12 2v6h6" /></g></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5" /></symbol>
      <symbol id="i-warn" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M12 3l9.5 17h-19zM12 10v4M12 17v.5" /></symbol>
      <symbol id="i-error" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9" /><path d="M12 7v6M12 16.5v.5" /></g></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9" /><path d="M12 11v6M12 7.5v.5" /></g></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5" cy="12" r="1.8" /><circle cx="12" cy="12" r="1.8" /><circle cx="19" cy="12" r="1.8" /></g></symbol>
      <symbol id="i-code" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8 7l-5 5 5 5M16 7l5 5-5 5" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" /></symbol>
      <symbol id="i-ul" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11" /><circle cx="4.5" cy="6" r="1" /><circle cx="4.5" cy="12" r="1" /><circle cx="4.5" cy="18" r="1" /></g></symbol>
      <symbol id="i-ol" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M10 6h10M10 12h10M10 18h10M4 5h1v4M4 9h2M4 15h2l-2 3h2" /></symbol>
      <symbol id="i-tasks" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="6" height="6" rx="1" /><path d="M4.5 16l1.5 1.5L9 14M13 7h8M13 16h8" /></g></symbol>
      <symbol id="i-quote" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M8 12h12M8 18h12M4 11v8" /></symbol>
      <symbol id="i-codeblock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 10l-2 2 2 2M15 10l2 2-2 2" /></g></symbol>
      <symbol id="i-table" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="1" /><path d="M3 10h18M3 15h18M10 4v16" /></g></symbol>
      <symbol id="i-hr" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 12h16" /></symbol>
      <symbol id="i-width" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 5v14M21 5v14M7 12h10M10 9l-3 3 3 3M14 9l3 3-3 3" /></symbol>
      <symbol id="i-sync" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4" /></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 14L4 9l5-5M4 9h11a5 5 0 0 1 0 10h-3" /></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 14l5-5-5-5M20 9H9a5 5 0 0 0 0 10h3" /></symbol>
    </svg>

    <header class="appbar">
      <span class="roche-logo" role="img" aria-label="Roche"></span>
      <div class="brand">Markitdown</div>
      <button id="btn-sidebar" class="icon-btn" title="Show or hide documents" aria-label="Show or hide documents" aria-controls="sidebar" aria-expanded="true">
        <svg class="i"><use href="#i-menu"></use></svg>
      </button>
      <input id="doc-name" class="doc-name" type="text" placeholder="Untitled" aria-label="Document name" maxlength="120" spellcheck="false" autocomplete="off" />
      <span class="appbar-spacer"></span>
      <button id="btn-more" class="icon-btn more-btn" aria-label="More actions" aria-expanded="false" aria-controls="actions">
        <svg class="i"><use href="#i-more"></use></svg>
      </button>
      <div class="actions" id="actions">
        <button id="btn-open" class="btn" title="Open a Markdown file (or drop one on the page)"><svg class="i"><use href="#i-folder"></use></svg><span>Open</span></button>
        <button id="btn-save-file" class="btn" title="Save to a file on this device (Ctrl+S)" hidden><svg class="i"><use href="#i-save"></use></svg><span class="label">Save</span></button>
        <button id="btn-save" class="btn" title="Download as a .md file"><svg class="i"><use href="#i-download"></use></svg><span>Download</span></button>
        <span class="sep"></span>
        <button id="btn-copy-md" class="btn primary" title="Copy the whole document as Markdown"><svg class="i"><use href="#i-copy"></use></svg><span>Copy Markdown</span></button>
        <button id="btn-copy-text" class="btn" title="Copy the whole document as plain text">Copy plain text</button>
        <span class="sep"></span>
        <div class="menu-wrap">
          <button id="btn-cleanup" class="btn quiet" aria-haspopup="menu" aria-expanded="false" aria-controls="cleanup-menu"><span>Clean up</span><svg class="i i-sm"><use href="#i-chevron"></use></svg></button>
          <div id="cleanup-menu" class="dropdown" role="menu" hidden>
            <button role="menuitem" data-cleanup="blank-lines">Collapse blank lines</button>
            <button role="menuitem" data-cleanup="trailing">Trim trailing whitespace</button>
            <button role="menuitem" data-cleanup="images">Remove images</button>
            <button role="menuitem" data-cleanup="links">Remove links, keep text</button>
            <button role="menuitem" data-cleanup="demote">Demote headings</button>
            <span class="menu-sep" role="separator"></span>
            <button role="menuitem" data-cleanup="normalize">Normalize Markdown</button>
          </div>
        </div>
        <button id="btn-clear" class="btn quiet" title="Clear the document">Clear</button>
        <button id="btn-theme" class="icon-btn" title="Switch between light and dark" aria-label="Switch to dark theme"><svg class="i"><use href="#i-moon"></use></svg></button>
      </div>
      <input id="file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden />
    </header>

    <div class="workspace" id="workspace">
      <nav class="sidebar" id="sidebar" aria-label="Documents">
        <div class="sidebar-head">
          <span class="sidebar-title">Documents</span>
          <span class="sidebar-actions">
            <button id="btn-new" class="btn link" title="New document, stored in this browser"><svg class="i i-sm"><use href="#i-plus"></use></svg><span>New</span></button>
            <button id="btn-new-file" class="btn link" title="New Markdown file on this device" hidden><svg class="i i-sm"><use href="#i-plus"></use></svg><span>File</span></button>
          </span>
        </div>
        <ul class="doc-tabs" id="doc-tabs" role="tablist" aria-orientation="vertical"></ul>
      </nav>
      <div class="main-col">
        <div class="filebar" id="filebar" hidden>
          <span class="file-name"><svg class="i i-file"><use href="#i-file"></use></svg><span id="file-name"></span></span>
          <span class="file-status" id="file-status" aria-live="polite"></span>
          <button id="btn-reconnect" class="btn small outline" hidden>Reconnect</button>
          <span class="filebar-spacer"></span>
          <label class="autosave"><input type="checkbox" id="chk-autosave" /> Autosave</label>
        </div>
        <div class="file-notice" id="file-notice" hidden>
          <svg class="i notice-icon"><use href="#i-info"></use></svg>
          <span>Editing on the left rewrites this file's Markdown in one consistent style (for example, <code>*</code> bullets become <code>-</code>). Edit on the right to change only what you type.</span>
          <button id="btn-notice-close" class="icon-btn small" aria-label="Dismiss"><svg class="i i-sm"><use href="#i-x"></use></svg></button>
        </div>
        <div class="view-switch" role="tablist" aria-label="View">
          <button role="tab" id="view-rich" aria-selected="true" data-view="rich">Rich text</button>
          <button role="tab" id="view-source" aria-selected="false" data-view="source">Markdown</button>
        </div>
        <main class="split" id="split" data-view="rich">
          <section class="pane pane-left" id="pane-left" aria-label="Rich text">
            <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting"></div>
            <div class="pane-body" id="wysiwyg"></div>
          </section>
          <div class="divider" id="divider" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize"></div>
          <section class="pane pane-right" id="pane-right" aria-label="Markdown source">
            <div class="pane-header">
              <span>Markdown source</span>
              <button id="btn-sync" class="btn small quiet sync-toggle" aria-pressed="true" title="Keep both panes scrolled to the same content"><svg class="i i-sm"><use href="#i-sync"></use></svg><span>Sync scroll</span></button>
            </div>
            <div class="pane-body" id="source"></div>
          </section>
        </main>
      </div>
    </div>

    <footer class="statusbar">
      <span id="stats">0 chars · 0 words · ≈0 tokens</span>
      <span id="status-hint" class="status-hint"></span>
      <button id="btn-copy-md-mobile" class="btn primary mobile-copy"><svg class="i"><use href="#i-copy"></use></svg><span>Copy Markdown</span></button>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="drop-overlay" class="drop-overlay" hidden>Drop Markdown files to open them</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
