<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Markitdown</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem('markitdown:theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch {}
    </script>
  </head>
  <body>
    <header class="appbar">
      <button id="btn-sidebar" class="icon-btn" title="Show/hide documents" aria-label="Show or hide documents" aria-controls="sidebar" aria-expanded="true">☰</button>
      <div class="brand">Markitdown</div>
      <input id="doc-name" class="doc-name" type="text" placeholder="Untitled" aria-label="Document name" maxlength="120" spellcheck="false" autocomplete="off" />
      <div class="actions">
        <button id="btn-open" title="Open a .md file as a new document (or drop one on the page)">Open</button>
        <button id="btn-save-file" title="Save to a file on this device (Ctrl+S)" hidden>Save</button>
        <button id="btn-save" title="Download as .md">Download</button>
        <span class="sep"></span>
        <button id="btn-copy-md" class="primary" title="Copy the whole document as Markdown">Copy Markdown</button>
        <button id="btn-copy-text" title="Copy the whole document as plain text">Copy plain text</button>
        <span class="sep"></span>
        <div class="menu-wrap">
          <button id="btn-cleanup" aria-haspopup="menu" aria-expanded="false">Cleanup ▾</button>
          <div id="cleanup-menu" class="dropdown" role="menu" hidden>
            <button role="menuitem" data-cleanup="blank-lines">Collapse blank lines</button>
            <button role="menuitem" data-cleanup="trailing">Trim trailing whitespace</button>
            <button role="menuitem" data-cleanup="images">Remove images</button>
            <button role="menuitem" data-cleanup="links">Remove links (keep text)</button>
            <button role="menuitem" data-cleanup="demote">Demote headings (H1 → H2…)</button>
            <button role="menuitem" data-cleanup="normalize">Normalize Markdown</button>
          </div>
        </div>
        <button id="btn-clear" title="Clear the document">Clear</button>
        <button id="btn-theme" title="Toggle light/dark theme" aria-label="Toggle theme"></button>
      </div>
      <input id="file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple hidden />
    </header>

    <div class="workspace" id="workspace">
      <nav class="sidebar" id="sidebar" aria-label="Documents">
        <div class="sidebar-head">
          <span>Documents</span>
          <span class="sidebar-actions">
            <button id="btn-new" title="New document (stored in this browser)">+ New</button>
            <button id="btn-new-file" title="New Markdown file on this device" hidden>+ File</button>
          </span>
        </div>
        <ul class="doc-tabs" id="doc-tabs" role="tablist" aria-orientation="vertical"></ul>
      </nav>
      <div class="main-col">
        <div class="filebar" id="filebar" hidden>
          <span class="file-icon" aria-hidden="true"></span>
          <span class="file-name" id="file-name"></span>
          <span class="file-status" id="file-status" aria-live="polite"></span>
          <button id="btn-reconnect" hidden>Reconnect</button>
          <span class="filebar-spacer"></span>
          <label class="autosave"><input type="checkbox" id="chk-autosave" /> Autosave</label>
        </div>
        <div class="file-notice" id="file-notice" hidden>
          <span>Editing on the left rewrites this file's Markdown in a normalized style (e.g. <code>*</code> bullets become <code>-</code>). Edit on the right to change only what you type.</span>
          <button id="btn-notice-close" aria-label="Dismiss">×</button>
        </div>
        <main class="split" id="split">
          <section class="pane pane-left" id="pane-left">
            <div class="toolbar" id="toolbar" role="toolbar" aria-label="Formatting"></div>
            <div class="pane-body" id="wysiwyg"></div>
          </section>
          <div class="divider" id="divider" role="separator" aria-orientation="vertical" tabindex="0" title="Drag to resize"></div>
          <section class="pane pane-right" id="pane-right">
            <div class="pane-header">Markdown source</div>
            <div class="pane-body" id="source"></div>
          </section>
        </main>
      </div>
    </div>

    <footer class="statusbar">
      <span id="stats">0 chars · 0 words · ≈0 tokens</span>
      <span id="toast" class="toast" aria-live="polite"></span>
    </footer>

    <div id="drop-overlay" class="drop-overlay" hidden>Drop Markdown files to open them as new documents</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
